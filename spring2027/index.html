<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMU Schedule Helper — Spring 2027</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root {
  --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #1e293b;
  --text-muted: #64748b; --primary: #3b82f6; --primary-light: #dbeafe;
  --danger: #ef4444; --danger-light: #fee2e2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f1f5f9;
    --text-muted: #94a3b8; --primary: #60a5fa; --primary-light: #1e3a5f;
    --danger: #f87171; --danger-light: #3b1111;
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f1f5f9;
  --text-muted: #94a3b8; --primary: #60a5fa; --primary-light: #1e3a5f;
  --danger: #f87171; --danger-light: #3b1111;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
input, select, button, textarea { font-family: inherit; font-size: 14px; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { font-size: 1.5rem; margin-bottom: 4px; }
.subtitle { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters input, .filters select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
.filters input[type="text"] { flex: 1; min-width: 200px; }
.filters select { min-width: 140px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { padding: 4px 12px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; border: 2px solid transparent; background: var(--surface); color: var(--text-muted); transition: all 0.15s; }
.chip:hover { border-color: var(--primary); }
.chip.active { color: #fff; }
.chip.dept { background: var(--primary-light); color: var(--primary); }
.chip.dept.active { background: var(--primary); color: #fff; }
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.8rem; }
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.sm { padding: 3px 8px; font-size: 0.75rem; }
.course-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
.course-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px; }
.course-num { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
.course-title { font-weight: 600; font-size: 0.95rem; }
.course-meta { color: var(--text-muted); font-size: 0.8rem; }
.sections { margin-top: 6px; }
.section-row { display: flex; gap: 12px; font-size: 0.8rem; color: var(--text-muted); padding: 2px 0; flex-wrap: wrap; }
.section-row.conflict { color: var(--danger); text-decoration: line-through; opacity: 0.6; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; margin-left: 6px; }
.time-block-section { margin-bottom: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.time-block-section h3 { font-size: 0.9rem; margin-bottom: 8px; }
.time-blocks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.time-block-tag { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; background: var(--danger-light); color: var(--danger); display: flex; align-items: center; gap: 4px; }
.time-block-tag button { background: none; border: none; color: inherit; cursor: pointer; font-size: 0.8rem; }
.add-block { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.add-block select, .add-block input { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font-size: 0.8rem; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 700px; width: 100%; max-height: 80vh; overflow-y: auto; }
.modal h2 { font-size: 1.1rem; margin-bottom: 12px; }
.modal textarea { width: 100%; min-height: 300px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: monospace; font-size: 0.8rem; }
.stats { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; }
.config-select { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
@media (max-width: 600px) {
  .filters input[type="text"] { min-width: 100%; }
  .course-header { flex-direction: column; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const BUILTIN_CONFIGS = ["ece-ms"];

const DAY_MAP = { M: 'Mon', T: 'Tue', W: 'Wed', R: 'Thu', F: 'Fri', S: 'Sat', U: 'Sun' };

function parseTime(t) {
  if (!t) return null;
  const m = t.match(/^(\d{1,2}):(\d{2})(AM|PM)$/i);
  if (!m) return null;
  let h = parseInt(m[1]);
  const min = parseInt(m[2]);
  const ampm = m[3].toUpperCase();
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  return h * 60 + min;
}

function expandDays(dayStr) {
  if (!dayStr || dayStr === 'TBA') return [];
  return dayStr.split('').map(d => DAY_MAP[d]).filter(Boolean);
}

function timesConflict(begin1, end1, begin2, end2) {
  const s1 = parseTime(begin1), e1 = parseTime(end1);
  const s2 = parseTime(begin2), e2 = parseTime(end2);
  if (s1 === null || e1 === null || s2 === null || e2 === null) return false;
  return s1 < e2 && s2 < e1;
}

function sectionConflictsWithBlocks(section, blocks) {
  const days = expandDays(section.days);
  for (const block of blocks) {
    const blockDays = expandDays(block.days);
    const overlap = days.some(d => blockDays.includes(d));
    if (overlap && timesConflict(section.begin, section.end, block.begin, block.end)) return true;
  }
  return false;
}

function courseMatchesCategory(course, cat) {
  if (course.level < (cat.minLevel || 0)) return false;
  const inDept = cat.departments && cat.departments.includes(course.dept);
  const included = cat.includeCourses && cat.includeCourses.includes(course.num);
  const excluded = cat.excludeCourses && cat.excludeCourses.includes(course.num);
  if (excluded) return false;
  return inDept || included;
}

function parseICS(text) {
  const blocks = [];
  const events = text.split('BEGIN:VEVENT');
  for (let i = 1; i < events.length; i++) {
    const ev = events[i];
    const dtstart = ev.match(/DTSTART[^:]*:(\d{8}T\d{6})/);
    const dtend = ev.match(/DTEND[^:]*:(\d{8}T\d{6})/);
    const rrule = ev.match(/RRULE:([^\r\n]+)/);
    const summary = ev.match(/SUMMARY:([^\r\n]+)/);
    if (!dtstart || !dtend) continue;
    const startH = parseInt(dtstart[1].substring(9, 11));
    const startM = parseInt(dtstart[1].substring(11, 13));
    const endH = parseInt(dtend[1].substring(9, 11));
    const endM = parseInt(dtend[1].substring(11, 13));
    const year = parseInt(dtstart[1].substring(0, 4));
    const month = parseInt(dtstart[1].substring(4, 6)) - 1;
    const day = parseInt(dtstart[1].substring(6, 8));
    const date = new Date(year, month, day);
    const dayOfWeek = date.getDay();
    const dayLetters = ['U', 'M', 'T', 'W', 'R', 'F', 'S'];

    let days = [dayLetters[dayOfWeek]];
    if (rrule) {
      const byday = rrule[1].match(/BYDAY=([A-Z,]+)/);
      if (byday) {
        const icalDays = { MO: 'M', TU: 'T', WE: 'W', TH: 'R', FR: 'F', SA: 'S', SU: 'U' };
        days = byday[1].split(',').map(d => icalDays[d]).filter(Boolean);
      }
    }
    const fmtTime = (h, m) => {
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      return `${String(h12).padStart(2, '0')}:${String(m).padStart(2, '0')}${ampm}`;
    };
    blocks.push({
      days: days.join(''),
      begin: fmtTime(startH, startM),
      end: fmtTime(endH, endM),
      label: summary ? summary[1].trim() : 'Calendar Event'
    });
  }
  return blocks;
}

function App() {
  const [courseData, setCourseData] = useState(null);
  const [search, setSearch] = useState('');
  const [levelFilter, setLevelFilter] = useState('');
  const [locationFilter, setLocationFilter] = useState('');
  const [selectedDepts, setSelectedDepts] = useState(new Set());
  const [selectedCats, setSelectedCats] = useState(new Set());
  const [configs, setConfigs] = useState([]);
  const [activeConfig, setActiveConfig] = useState(null);
  const [timeBlocks, setTimeBlocks] = useState([]);
  const [hideConflicts, setHideConflicts] = useState(false);
  const [showEditor, setShowEditor] = useState(false);
  const [editorJson, setEditorJson] = useState('');
  const [newBlockDay, setNewBlockDay] = useState('M');
  const [newBlockBegin, setNewBlockBegin] = useState('09:00AM');
  const [newBlockEnd, setNewBlockEnd] = useState('10:00AM');
  const fileInputRef = useRef(null);
  const icsInputRef = useRef(null);

  // Load course data
  useEffect(() => {
    fetch('data/courses.json?v=' + Date.now())
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(d => {
        setCourseData(d);
        const hasLoc = d.courses?.some(c => c.sections?.some(s => s.loc));
        console.log('[CMU Schedule Helper] Loaded', d.courses?.length, 'courses, locations:', hasLoc);
        if (hasLoc) setLocationFilter('Pittsburgh, Pennsylvania');
      })
      .catch(e => console.error('[CMU Schedule Helper] Failed to load courses:', e));
  }, []);

  // Load builtin configs
  useEffect(() => {
    Promise.all(
      BUILTIN_CONFIGS.map(id =>
        fetch(`configs/${id}.json?v=` + Date.now())
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .catch(e => { console.warn(`[Config] Failed to load ${id}:`, e); return null; })
      )
    ).then(results => {
      const loaded = results.filter(Boolean);
      console.log('[CMU Schedule Helper] Loaded', loaded.length, 'configs');
      setConfigs(loaded);
      if (loaded.length > 0 && !activeConfig) {
        setActiveConfig(loaded[0]);
      }
    });
  }, []);

  // Derived data
  const locations = useMemo(() => {
    if (!courseData?.courses) return [];
    const locs = new Set();
    courseData.courses.forEach(c => c.sections?.forEach(s => { if (s.loc) locs.add(s.loc); }));
    return Array.from(locs).sort();
  }, [courseData]);

  const deptGroups = useMemo(() => {
    if (!courseData?.courses) return [];
    const groups = {};
    courseData.courses.forEach(c => {
      if (!groups[c.dept]) groups[c.dept] = { dept: c.dept, name: c.deptName, count: 0 };
      groups[c.dept].count++;
    });
    return Object.values(groups).sort((a, b) => a.dept.localeCompare(b.dept));
  }, [courseData]);

  const filteredCourses = useMemo(() => {
    if (!courseData?.courses) return [];
    return courseData.courses.filter(c => {
      // Search
      if (search) {
        const q = search.toLowerCase();
        if (!c.num.toLowerCase().includes(q) && !c.title.toLowerCase().includes(q) && !c.deptName.toLowerCase().includes(q)) return false;
      }
      // Level
      if (levelFilter) {
        const lvl = parseInt(levelFilter);
        if (c.level < lvl) return false;
      }
      // Location
      if (locationFilter) {
        const hasMatch = c.sections.some(s => s.loc && s.loc === locationFilter);
        if (!hasMatch) return false;
      }
      // Department chips
      if (selectedDepts.size > 0 && !selectedDepts.has(c.dept)) return false;
      // Requirement category chips
      if (selectedCats.size > 0 && activeConfig) {
        const matchesAnyCat = activeConfig.categories.some(cat => selectedCats.has(cat.id) && courseMatchesCategory(c, cat));
        if (!matchesAnyCat) return false;
      }
      // Conflict filter
      if (hideConflicts && timeBlocks.length > 0) {
        const lectureSections = c.sections.filter(s => s.id === 'Lec' || (!c.sections.some(ss => ss.id === 'Lec')));
        if (lectureSections.length > 0) {
          const allConflict = lectureSections.every(s => sectionConflictsWithBlocks(s, timeBlocks));
          if (allConflict) return false;
        }
      }
      return true;
    });
  }, [courseData, search, levelFilter, locationFilter, selectedDepts, selectedCats, activeConfig, hideConflicts, timeBlocks]);

  const toggleDept = (dept) => {
    setSelectedDepts(prev => {
      const next = new Set(prev);
      next.has(dept) ? next.delete(dept) : next.add(dept);
      return next;
    });
  };

  const toggleCat = (catId) => {
    setSelectedCats(prev => {
      const next = new Set(prev);
      next.has(catId) ? next.delete(catId) : next.add(catId);
      return next;
    });
  };

  const addTimeBlock = () => {
    setTimeBlocks(prev => [...prev, { days: newBlockDay, begin: newBlockBegin, end: newBlockEnd, label: 'Blocked' }]);
  };

  const removeTimeBlock = (idx) => {
    setTimeBlocks(prev => prev.filter((_, i) => i !== idx));
  };

  const handleICSImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const blocks = parseICS(ev.target.result);
      setTimeBlocks(prev => [...prev, ...blocks]);
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const handleConfigImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const cfg = JSON.parse(ev.target.result);
        setConfigs(prev => [...prev.filter(c => c.id !== cfg.id), cfg]);
        setActiveConfig(cfg);
      } catch (err) { alert('Invalid JSON: ' + err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const openEditor = () => {
    setEditorJson(activeConfig ? JSON.stringify(activeConfig, null, 2) : '{\n  "id": "custom",\n  "name": "Custom Config",\n  "categories": []\n}');
    setShowEditor(true);
  };

  const saveEditor = () => {
    try {
      const cfg = JSON.parse(editorJson);
      setConfigs(prev => [...prev.filter(c => c.id !== cfg.id), cfg]);
      setActiveConfig(cfg);
      setShowEditor(false);
    } catch (err) { alert('Invalid JSON: ' + err.message); }
  };

  if (!courseData) return <div className="container"><h1>CMU Schedule Helper</h1><p>Loading course data...</p></div>;

  return (
    <div className="container">
      <h1>CMU Schedule Helper</h1>
      <div className="subtitle">{courseData.semester} · {courseData.courses.length} courses · Updated {courseData.updated}</div>

      {/* Config selector */}
      <div className="config-select">
        <select value={activeConfig?.id || ''} onChange={e => {
          const cfg = configs.find(c => c.id === e.target.value);
          setActiveConfig(cfg || null);
          setSelectedCats(new Set());
        }}>
          <option value="">No requirement filter</option>
          {configs.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <button className="btn sm" onClick={openEditor}>Edit Config</button>
        <button className="btn sm" onClick={() => fileInputRef.current?.click()}>Import Config</button>
        {activeConfig && <button className="btn sm" onClick={() => {
          const blob = new Blob([JSON.stringify(activeConfig, null, 2)], { type: 'application/json' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = activeConfig.id + '.json'; a.click();
        }}>Export</button>}
        <input ref={fileInputRef} type="file" accept=".json" style={{display:'none'}} onChange={handleConfigImport} />
      </div>

      {/* Requirement category chips */}
      {activeConfig && (
        <div className="chips">
          {activeConfig.categories.map(cat => (
            <span key={cat.id} className={`chip ${selectedCats.has(cat.id) ? 'active' : ''}`}
              style={selectedCats.has(cat.id) ? { background: cat.color, borderColor: cat.color, color: '#fff' } : { borderColor: cat.color, color: cat.color }}
              onClick={() => toggleCat(cat.id)} title={cat.notes || cat.description}>
              {cat.name}
            </span>
          ))}
        </div>
      )}

      {/* Search and filters */}
      <div className="filters">
        <input type="text" placeholder="Search courses..." value={search} onChange={e => setSearch(e.target.value)} />
        <select value={levelFilter} onChange={e => setLevelFilter(e.target.value)}>
          <option value="">All levels</option>
          <option value="100">100+</option>
          <option value="200">200+</option>
          <option value="300">300+</option>
          <option value="400">400+</option>
          <option value="500">500+</option>
          <option value="600">600+</option>
          <option value="700">700+</option>
        </select>
        <select value={locationFilter} onChange={e => setLocationFilter(e.target.value)}>
          <option value="">All locations</option>
          {locations.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
      </div>

      {/* Department chips */}
      <div className="chips">
        {deptGroups.slice(0, 30).map(g => (
          <span key={g.dept} className={`chip dept ${selectedDepts.has(g.dept) ? 'active' : ''}`}
            onClick={() => toggleDept(g.dept)} title={g.name}>
            {g.dept} ({g.count})
          </span>
        ))}
        {selectedDepts.size > 0 && <span className="chip" onClick={() => setSelectedDepts(new Set())} style={{color: 'var(--danger)'}}>✕ Clear</span>}
      </div>

      {/* Time blocking */}
      <div className="time-block-section">
        <h3>Schedule Conflicts</h3>
        <div style={{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap'}}>
          <label style={{fontSize:'0.8rem'}}>
            <input type="checkbox" checked={hideConflicts} onChange={e => setHideConflicts(e.target.checked)} /> Hide courses that conflict with blocked times
          </label>
          <button className="btn sm" onClick={() => icsInputRef.current?.click()}>Import .ics</button>
          <input ref={icsInputRef} type="file" accept=".ics" style={{display:'none'}} onChange={handleICSImport} />
        </div>
        {timeBlocks.length > 0 && (
          <div className="time-blocks">
            {timeBlocks.map((b, i) => (
              <span key={i} className="time-block-tag">
                {b.days} {b.begin}–{b.end} {b.label !== 'Blocked' ? `(${b.label})` : ''}
                <button onClick={() => removeTimeBlock(i)}>✕</button>
              </span>
            ))}
          </div>
        )}
        <div className="add-block">
          <select value={newBlockDay} onChange={e => setNewBlockDay(e.target.value)}>
            {['M','T','W','R','F','MW','TR','MWF','TBA'].map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          <input type="text" value={newBlockBegin} onChange={e => setNewBlockBegin(e.target.value)} style={{width:'80px'}} placeholder="09:00AM" />
          <input type="text" value={newBlockEnd} onChange={e => setNewBlockEnd(e.target.value)} style={{width:'80px'}} placeholder="10:00AM" />
          <button className="btn sm primary" onClick={addTimeBlock}>+ Block</button>
          {timeBlocks.length > 0 && <button className="btn sm danger" onClick={() => setTimeBlocks([])}>Clear All</button>}
        </div>
      </div>

      {/* Stats */}
      <div className="stats">
        Showing {filteredCourses.length} / {courseData.courses.length} courses
        {selectedCats.size > 0 && activeConfig && ` · Filtered by: ${activeConfig.categories.filter(c => selectedCats.has(c.id)).map(c => c.name).join(', ')}`}
      </div>

      {/* Course list */}
      {filteredCourses.slice(0, 200).map(c => {
        const matchingCats = activeConfig ? activeConfig.categories.filter(cat => courseMatchesCategory(c, cat)) : [];
        return (
          <div key={c.num} className="course-card">
            <div className="course-header">
              <div>
                <span className="course-num">{c.num}</span>{' '}
                <span className="course-title">{c.title}</span>
                {matchingCats.map(cat => (
                  <span key={cat.id} className="badge" style={{background: cat.color, color: '#fff'}}>{cat.name}</span>
                ))}
              </div>
              <span className="course-meta">{c.units} units · {c.deptName}</span>
            </div>
            {c.sections.length > 0 && (
              <div className="sections">
                {c.sections.map((s, i) => {
                  const conflict = timeBlocks.length > 0 && sectionConflictsWithBlocks(s, timeBlocks);
                  return (
                    <div key={i} className={`section-row${conflict ? ' conflict' : ''}`}>
                      {s.id && <span style={{fontWeight:600, minWidth:'30px'}}>{s.id}</span>}
                      <span style={{minWidth:'40px'}}>{s.days || 'TBA'}</span>
                      <span style={{minWidth:'120px'}}>{s.begin && s.end ? `${s.begin} – ${s.end}` : ''}</span>
                      {s.loc && <span>{s.loc}</span>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
      {filteredCourses.length > 200 && <p className="stats">Showing first 200 of {filteredCourses.length} results. Narrow your search to see more.</p>}
      {filteredCourses.length === 0 && <p className="stats">No courses match the current filters.</p>}

      {/* Config editor modal */}
      {showEditor && (
        <div className="modal-overlay" onClick={() => setShowEditor(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2>Edit Requirement Config</h2>
            <textarea value={editorJson} onChange={e => setEditorJson(e.target.value)} />
            <div style={{display:'flex', gap:'8px', marginTop:'12px', justifyContent:'flex-end'}}>
              <button className="btn" onClick={() => setShowEditor(false)}>Cancel</button>
              <button className="btn primary" onClick={saveEditor}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
